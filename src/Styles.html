function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(function(screen) {
    screen.classList.remove('active');
  });

  const target = document.getElementById(screenId);

  if (target) {
    target.classList.add('active');
  }

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

  if (screenId === 'weighingScreen') {
    loadWeighingQueue();
  }
}


function goBack(screenId) {
  showScreen(screenId);
}

    errorBox.style.display = 'none';
    errorBox.innerText = '';
  }

  selectedSupplierType = type;

  const householdCard = document.getElementById('householdCard');
  const continueButton = document.getElementById('continueTypeButton');

  if (umkmCard) {
    umkmCard.classList.toggle('selected', type === 'UMKM');
  }

  if (householdCard) {
    householdCard.classList.toggle('selected', type === 'HOUSEHOLD');

  if (continueButton) {
    continueButton.disabled = false;
  }
}

  const typeLabel = document.getElementById('selectedTypeLabel');

        : 'Rumah Tangga';
  }

  showScreen('formScreen');
}

  const errorBox = document.getElementById('phoneErrorBox');
  const button = document.getElementById('checkPhoneButton');
  const loading = document.getElementById('phoneLoading');

      errorBox.innerText = 'Masukkan nomor HP terlebih dahulu.';
      errorBox.style.display = 'block';

    return;

  if (errorBox) {
    errorBox.style.display = 'none';
    errorBox.innerText = '';

  if (button) {
    button.disabled = true;

  if (loading) {
    loading.style.display = 'block';
  }

  google.script.run
    .withSuccessHandler(function(result) {

      if (button) {
        button.disabled = false;
      }

      if (loading) {
        loading.style.display = 'none';
      }

      if (!result || !result.success) {
        if (errorBox) {
          errorBox.innerText =
            (result && result.message)
              ? result.message
              : 'Nomor HP belum terdaftar.';
          errorBox.style.display = 'block';
        }

        return;
      }

      currentSupplier = result.supplier || null;
      currentPhone = phone;

      renderReturningUser(result);

      showScreen('returningScreen');
    })
    .withFailureHandler(function(error) {

      console.error('Phone check error:', error);

      if (button) {
        button.disabled = false;
      }

      if (loading) {
        loading.style.display = 'none';
      }

      if (errorBox) {
        errorBox.innerText =
          'Terjadi kesalahan saat mengecek data.';
        errorBox.style.display = 'block';
      }
    })
    .getSupplierByPhone(phone);
}
